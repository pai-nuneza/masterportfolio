<!-- A legacy Earth, still working, upgraded region by region by a tiny robot that then keeps it maintained; styles live in styles.css. -->
<svg class="legacy-planet" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="lp-old-sea" cx="35%" cy="30%">
      <stop offset="0" stop-color="#7fa3ad" />
      <stop offset="0.55" stop-color="#3d6170" />
      <stop offset="1" stop-color="#16303b" />
    </radialGradient>
    <radialGradient id="lp-sea" cx="35%" cy="30%">
      <stop offset="0" stop-color="#6cc1ff" />
      <stop offset="0.5" stop-color="#1f6fd1" />
      <stop offset="1" stop-color="#0a2a5e" />
    </radialGradient>
    <radialGradient id="lp-shade" cx="35%" cy="30%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#000" stop-opacity="0.55" />
    </radialGradient>
    <radialGradient id="lp-glow">
      <stop offset="0.85" stop-color="#38e1ff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="lp-body"><circle cx="100" cy="100" r="80" /></clipPath>
    <clipPath *ngFor="let region of regions; let i = index" [attr.id]="'lp-region-' + i">
      <polygon [attr.points]="region.outline" />
    </clipPath>
    <g id="lp-land">
      <path d="M30 58 C44 44 66 42 76 52 C82 60 74 70 64 72 C56 76 54 86 46 88 C38 86 30 76 28 68 Z" />
      <path d="M40 104 C52 100 62 108 64 120 C66 134 58 148 52 160 C48 152 44 140 40 128 C36 118 34 108 40 104 Z" />
      <path d="M95 38 C110 30 140 34 158 48 C166 58 160 66 148 64 C138 70 128 62 118 66 C110 70 100 62 96 56 Z" />
      <path d="M98 72 C112 68 128 74 132 88 C138 104 130 120 122 136 C116 150 108 152 104 140 C100 126 92 116 90 102 C86 90 88 78 98 72 Z" />
      <path d="M146 128 C156 124 168 128 168 138 C166 146 154 148 146 144 C140 140 140 132 146 128 Z" />
    </g>
    <!-- Legacy Earth: older colours and a few dim lights, but whole and working. -->
    <g id="lp-legacy">
      <circle cx="100" cy="100" r="80" fill="url(#lp-old-sea)" />
      <use href="#lp-land" class="lp-old-land" />
      <g class="lp-old-clouds">
        <ellipse cx="70" cy="40" rx="22" ry="5" />
        <ellipse cx="130" cy="92" rx="18" ry="4" />
        <ellipse cx="60" cy="132" rx="16" ry="4" />
        <ellipse cx="150" cy="150" rx="20" ry="4.5" />
      </g>
      <g class="lp-old-city">
        <circle *ngFor="let light of legacyLights" [attr.cx]="light.x" [attr.cy]="light.y" r="0.9" />
      </g>
    </g>
    <g id="lp-alive">
      <circle cx="100" cy="100" r="80" fill="url(#lp-sea)" />
      <use href="#lp-land" class="lp-land" />
      <g class="lp-clouds">
        <ellipse cx="70" cy="40" rx="22" ry="5" />
        <ellipse cx="130" cy="92" rx="18" ry="4" />
        <ellipse cx="60" cy="132" rx="16" ry="4" />
        <ellipse cx="150" cy="150" rx="20" ry="4.5" />
      </g>
    </g>
  </defs>

  <!-- The upgraded planet's atmosphere glow, brightening as the upgrade spreads. -->
  <circle #halo cx="100" cy="100" r="92" fill="url(#lp-glow)" opacity="0" />

  <!-- Orbits drawn whole behind the planet (it hides their far side), then their near half again in front; both share one #orbit index per satellite. -->
  <g *ngFor="let s of satellites" #orbit class="lp-orbit" [attr.transform]="'rotate(' + s.tilt + ' 100 100)'" opacity="0">
    <ellipse cx="100" cy="100" [attr.rx]="s.rx" [attr.ry]="s.ry" />
  </g>

  <!-- The robot is moved in here while it flies round the back of the planet. -->
  <g #botBehind></g>

  <g clip-path="url(#lp-body)">
    <g *ngFor="let region of regions; let i = index" [attr.clip-path]="'url(#lp-region-' + i + ')'">
      <use href="#lp-legacy" />
      <use #alive href="#lp-alive" opacity="0" />
      <!-- The upgrade: many more, brighter city lights once the region is powered up. -->
      <g #lights class="lp-city" opacity="0">
        <circle *ngFor="let light of region.lights" [attr.cx]="light.x" [attr.cy]="light.y" r="1.1" />
      </g>
      <circle #flash class="lp-region-flash" cx="100" cy="100" r="80" opacity="0" />
    </g>
  </g>
  <circle cx="100" cy="100" r="80" fill="url(#lp-shade)" />

  <g *ngFor="let s of satellites" #orbit class="lp-orbit" [attr.transform]="'rotate(' + s.tilt + ' 100 100)'" opacity="0">
    <path [attr.d]="'M' + (100 + s.rx) + ' 100 A' + s.rx + ' ' + s.ry + ' 0 0 1 ' + (100 - s.rx) + ' 100'" />
  </g>

  <!-- Upgrade traces the robot lays along each region's edges: white-hot under the torch, then a fading cyan glow. -->
  <path #seam *ngFor="let region of regions" class="lp-weld" [attr.d]="region.seam" pathLength="1" />

  <!-- Satellites launched by the upgrade; they disappear while passing behind the planet. -->
  <g *ngFor="let s of satellites" #sat class="lp-sat" opacity="0">
    <rect class="lp-sat-panel" x="-6.4" y="-1" width="4" height="2" />
    <rect class="lp-sat-panel" x="2.4" y="-1" width="4" height="2" />
    <rect class="lp-sat-body" x="-2" y="-1.8" width="4" height="3.6" rx="0.6" />
    <circle class="lp-sat-beacon" cx="0" cy="-2.6" r="0.7" />
  </g>

  <!-- The tiny repair robot: faces where it flies and welds with the spark under its nose. Docks as the hire assistant when done. -->
  <g #botFront>
    <g #bot transform="translate(-200 -200)">
      <path class="lp-bot-flame lp-bot-tail" d="M-9 -1.5 Q-16 0 -9 1.5 Z" />
      <rect class="lp-bot lp-bot-tail" x="-9" y="-3" width="10" height="6" rx="2" />
      <circle class="lp-bot" cx="4" cy="0" r="3.6" />
      <circle class="lp-bot-eye" cx="5.4" cy="-0.8" r="0.9" />
      <circle class="lp-spark" cx="-1" cy="8" r="2.4" />
    </g>
  </g>
</svg>
