<section id="works" class="selected-works-section py-5">
  <div class="works-container">
    <div class="section-header">
      <span class="section-kicker">Completed missions</span>
      <h2 class="section-title">Things I’ve built and shipped</h2>
      <p class="section-subtitle">Legacy rebuilds, client work, and personal projects.</p>
    </div>

    <div class="works-grid">
      <article class="work-card" [class.work-card-large]="item.isLargeCard" *ngFor="let item of allProjects">
        <div class="work-image-wrap" [class.image-loading]="!loadedImages.has(item.imgLink)">
          <img
            [src]="item.imgLink"
            [alt]="item.title"
            class="work-image"
            loading="lazy"
            decoding="async"
            (load)="markImageLoaded(item.imgLink)" />
        </div>

        <div class="work-content">
          <div class="work-meta">
            <span [class.mobile-hide-on-phone]="item.category === 'Legacy Data Migration'">
              {{ item.category }}<ng-container *ngIf="item.projectType === 'Personal'"> · Personal</ng-container>
            </span>
            <span>{{ item.date }}</span>
          </div>

          <h3>{{ item.title }}</h3>
          <p>{{ item.description || item.text }}</p>

          <div class="work-tech">
            <span class="tech-pill" *ngFor="let tech of visibleTechnologies(item)">{{ tech }}</span>
            <span class="tech-pill more" *ngIf="extraTechnologyCount(item) > 0">
              +{{ extraTechnologyCount(item) }} more
            </span>
          </div>

          <div class="work-actions">
            <a
              *ngIf="item.liveLink && item.liveLink !== '#'"
              [href]="item.liveLink"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-demo"
              (click)="$event.stopPropagation()">
              Live Demo <i class="fas fa-external-link-alt"></i>
            </a>
            <a
              *ngIf="item.githubLink && (!item.liveLink || item.liveLink === '#')"
              [href]="item.githubLink"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-demo"
              (click)="$event.stopPropagation()">
              GitHub <i class="fab fa-github"></i>
            </a>
            <a class="btn-details" [routerLink]="['/projects', item.id]">
              Details
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>

</section>
